<!DOCTYPE html>
<html lang="en">

    <head>

        <meta charset="UTF-8">

        <title>Student Portal</title>

        <style>
            body {
                font-family: Arial, sans-serif;
                background: #fff;
                margin: 0;
            }
            .tab {
                padding: 10px 20px;
                cursor: pointer;
                display: inline-block;
                background-color: #f0f0f0;
                border: 1px solid #ddd;
                border-bottom: none;
            }
            .tab.active {
                background-color: #007bff; 
                color: #fff; 
                border-color: #007bff;
            }
            .tab-content {
                border: 1px solid #ddd;
                padding: 20px;
                display: none;
            }
            .tab-content.active {
                display: block;
            }
            .home-link {
                display: block;
                text-align: center;
                margin: 10px 0;
                text-decoration: none;
                color: #007bff; 
                font-weight: bold;
            }
        </style>

    </head>

    <body>

        <a href="/" class="home-link">Home</a>

        <h1 style="text-align:center;">Student Portal</h1>

        <!-- Thie Section shows 2 tabs  and by default load Remote Allowed prediction Tab -->
        <div class="tab-container" style="text-align:center;">
            <div class="tab active" onclick="openTab(event, 'remotePrediction')">Remote Allowed Prediction</div>
            <div class="tab" onclick="openTab(event, 'workTypePrediction')">Work Type Prediction</div>
        </div>

        <!-- Thie Section shows Remote Allowed prediction html file under this div keeping everything in Single Page-->
        <div id="remotePrediction" class="tab-content active">
            {% include 'remote_allowed.html' %}
        </div>

        <!-- Thie Section shows Work type prediction html file under this div keeping everything in Single Page-->
        <div id="workTypePrediction" class="tab-content">
            {% include 'worktype.html' %}
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', function() {
                // Assuming 'remote-allowed-form' and 'worktype-form' are the IDs of the forms in your included templates
                document.getElementById('remote-allowed-form').addEventListener('submit', function(event) {
                    event.preventDefault(); // Prevent default form submission
                    onsubmitForm();
                });

                document.getElementById('worktype-form').addEventListener('submit', function(event) {
                    event.preventDefault(); // Prevent default form submission
                    submitForm();
                });
            });
                    // The function opens the respective tab based on the user click and also loads the remote Allowed tab by default.
            function openTab(evt, tabName) {
                var i, tabcontent, tablinks;
                tabcontent = document.getElementsByClassName("tab-content");
                for (i = 0; i < tabcontent.length; i++) {
                    tabcontent[i].style.display = "none";
                }
                tablinks = document.getElementsByClassName("tab");
                for (i = 0; i < tablinks.length; i++) {
                    tablinks[i].className = tablinks[i].className.replace(" active", "");
                }
                document.getElementById(tabName).style.display = "block";
                evt.currentTarget.className += " active";
            }

        </script>

    </body>

</html>
